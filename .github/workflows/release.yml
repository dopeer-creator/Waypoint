name: Release

# Push a tag like v0.2.0 (e.g. `npm version minor && git push --follow-tags`) to build the installer
# and publish it, with its blockmap and latest.yml, as a GitHub Release. Installed copies pick it up on next launch.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

# GitHub has started this workflow twice for a single tag push (v0.9.0). Both runs built and uploaded at the same
# time, each into its own draft, and the slower one's draft was left behind next to the published release. Runs
# for the same tag now go one at a time, and the `check` job stops any run that finds the tag already released.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.existing.outputs.state }}
    steps:
      - name: Look for an existing release for this tag
        id: existing
        shell: bash
        run: |
          # published: nothing to do. draft: an earlier run failed part-way, carry on into it. none: fresh release.
          if out=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>&1); then
            if [ "$out" = "true" ]; then state=draft; else state=published; fi
          elif echo "$out" | grep -qi "release not found"; then
            state=none
          else
            echo "Could not check for an existing release: $out"
            exit 1
          fi
          echo "Release $GITHUB_REF_NAME: $state"
          echo "state=$state" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  release:
    needs: check
    if: needs.check.outputs.state != 'published'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci

      - run: npm run typecheck

      # Pull this version's notes from CHANGELOG.md (the section under "## <tag>"); fall back to auto notes.
      - name: Release notes
        shell: bash
        run: |
          awk -v v="$GITHUB_REF_NAME" '$0=="## "v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md || true
          if [ -s notes.md ]; then echo "have_notes=true" >> "$GITHUB_ENV"; else echo "have_notes=false" >> "$GITHUB_ENV"; fi

      # Create the release up front. electron-builder uploads its files in parallel, and without an existing
      # release each upload can create its own, splitting the files across duplicate releases. Skipped when a
      # draft is already there (a re-run after a failed build), so a second draft is never made for one tag.
      - name: Create draft release
        if: needs.check.outputs.state == 'none'
        shell: bash
        run: |
          if [ "$have_notes" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" --draft --title "Waypoint ${GITHUB_REF_NAME#v}" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "Waypoint ${GITHUB_REF_NAME#v}" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and upload
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check all files uploaded
        shell: bash
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          echo "$assets"
          for f in latest.yml "Waypoint-Setup-${GITHUB_REF_NAME#v}.exe" "Waypoint-Setup-${GITHUB_REF_NAME#v}.exe.blockmap"; do
            echo "$assets" | grep -qx "$f" || { echo "Missing $f"; exit 1; }
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
