<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Waypoint</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/48.png" alt="" width="32" height="32" />
      <div>
        <strong>Waypoint</strong>
        <span>Browser extension</span>
      </div>
    </header>
    <p id="status" class="status">Checking…</p>
    <p class="hint">
      While Waypoint is resolving a link, click Download on that site as usual and Waypoint takes the file. Other
      downloads stay in the browser.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
