<!-- the real control: no href, driven purely by a JS click handler.
     first click opens an "ad", only the second starts the download -->
<a class="primary" id="go">Download</a>

<script>
  // State goes on the DOM, not window: patchright's page.evaluate runs in an isolated world and can't
  // see page globals, but both worlds share the DOM.
  const flag = (name) => { document.documentElement.dataset[name] = '1' }
  let clicks = 0

    clicks++
    document.documentElement.dataset.clicks = String(clicks)
    if (clicks === 1) { flag('adOpened'); return }
    flag('downloaded')
  })
</script>
